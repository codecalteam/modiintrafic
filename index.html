<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניטור תאונות דרכים - מודיעין מכבים רעות</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        scaleIn: {
                             '0%': { transform: 'scale(0.95)', opacity: '0' },
                             '100%': { transform: 'scale(1)', opacity: '1' },
                        }
                    },
                    animation: {
                        fadeIn: 'fadeIn 0.3s ease-out',
                        scaleIn: 'scaleIn 0.2s ease-out',
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Styles -->
    <style>
        body { font-family: 'Heebo', sans-serif; background-color: #f8fafc; }
        .leaflet-popup-content-wrapper { text-align: right; direction: rtl; font-family: 'Heebo', sans-serif; }
        .leaflet-popup-tip { background: white; }
        /* Loading Spinner */
        .loader {
            border: 4px solid #e2e8f0;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <!-- React & ReactDOM (React 18) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Prop-Types (Required dependency for Recharts UMD) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>

    <!-- Recharts (Stable Version) -->
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Proj4 JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <!-- SheetJS (XLSX) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, Component } = React;

        // --- Error Boundary Component ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }

            componentDidCatch(error, errorInfo) {
                console.error("Uncaught error:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center bg-red-50 p-4 text-center">
                            <div className="bg-white p-8 rounded-xl shadow-lg max-w-lg w-full border border-red-200">
                                <h2 className="text-2xl font-bold text-red-600 mb-4">אופס! משהו השתבש.</h2>
                                <p className="text-gray-600 mb-4">אירעה שגיאה בטעינת הרכיב.</p>
                                <div className="bg-gray-100 p-2 rounded text-left text-xs mb-4 overflow-auto max-h-32" dir="ltr">
                                    {this.state.error && this.state.error.toString()}
                                </div>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition"
                                >
                                    רענן דף
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- Icons ---
        const IconWrapper = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {
            Map: (props) => <IconWrapper {...props}><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon><line x1="8" y1="2" x2="8" y2="18"></line><line x1="16" y1="6" x2="16" y2="22"></line></IconWrapper>,
            Car: (props) => <IconWrapper {...props}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"></path><circle cx="7" cy="17" r="2"></circle><path d="M9 17h6"></path><circle cx="17" cy="17" r="2"></circle></IconWrapper>,
            MapPin: (props) => <IconWrapper {...props}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></IconWrapper>,
            AlertTriangle: (props) => <IconWrapper {...props}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></IconWrapper>,
            Plus: (props) => <IconWrapper {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></IconWrapper>,
            Upload: (props) => <IconWrapper {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></IconWrapper>,
            X: (props) => <IconWrapper {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></IconWrapper>,
            Filter: (props) => <IconWrapper {...props}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></IconWrapper>,
            FileUp: (props) => <IconWrapper {...props}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M12 12v6"></path><path d="M9 15l3-3 3 3"></path></IconWrapper>,
            FileText: (props) => <IconWrapper {...props}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></IconWrapper>
        };

        // --- Helper Functions ---
        const convertITMtoWGS84 = (x, y) => {
            if (window.proj4) {
                try {
                    const itm = "+proj=tmerc +lat_0=31.73439361111111 +lon_0=35.20451694444445 +k=1.0000067 +x_0=219529.584 +y_0=626907.39 +ellps=GRS80 +towgs84=-48,55,52,0,0,0,0 +units=m +no_defs";
                    const wgs84 = "+proj=longlat +datum=WGS84 +no_defs";
                    const result = window.proj4(itm, wgs84, [x, y]);
                    if (Array.isArray(result) && result.length === 2 && !isNaN(result[0]) && !isNaN(result[1])) {
                        return result;
                    }
                } catch (e) {
                    console.warn("Proj4 conversion error", e);
                }
            }
            return [35.007, 31.895]; 
        };

        // --- Mock Data ---
        const INITIAL_DATA = [
            { id: 1128016, year: 2021, month: 'ינואר', severity: 'קלה', type: 'התנגשות חזית אל צד', roadType: 'עירונית בצומת', location: 'צומת הרחובות: רא"ל חיים ברלב / רא"ל יעקב דורי', street1: 'רא"ל יעקב דורי', street2: 'רא"ל חיים ברלב', x: 200071, y: 646246, users: { car: 1 } },
            { id: 1389776, year: 2025, month: 'יולי', severity: 'קטלנית', type: 'פגיעה בהולך רגל', roadType: 'עירונית בצומת', location: 'צומת הרחובות: שד יצחק רבין / יהודה המכבי', street1: 'יהודה המכבי', street2: 'שד יצחק רבין', x: 199061, y: 644640, users: { pedestrian: 1, car: 1 } },
            { id: 1391183, year: 2025, month: 'יולי', severity: 'קלה', type: 'התנגשות חזית אל צד', roadType: 'עירונית לא בצומת', location: 'הרכבת', street1: 'הרכבת', street2: '', x: 200761, y: 645432, users: { car: 2 } },
            { id: 1391727, year: 2025, month: 'מרץ', severity: 'קשה', type: 'תאונה עצמית', roadType: 'עירונית לא בצומת', location: 'יער בן שמן', street1: 'יער בן שמן', street2: '', x: 198648, y: 645089, users: { motorcycle: 1 } },
            { id: 1234567, year: 2022, month: 'פברואר', severity: 'קשה', type: 'פגיעה בהולך רגל', roadType: 'עירונית בצומת', location: 'עמק האלה', street1: 'עמק האלה', street2: '', x: 201000, y: 645000, users: { pedestrian: 1 } },
            { id: 1234568, year: 2023, month: 'יוני', severity: 'קלה', type: 'התנגשות אחור אל חזית', roadType: 'עירונית לא בצומת', location: 'שדרות החשמונאים', street1: 'שדרות החשמונאים', street2: '', x: 200500, y: 645500, users: { car: 2 } },
            { id: 1234569, year: 2024, month: 'אוגוסט', severity: 'קלה', type: 'התנגשות צד', roadType: 'עירונית בצומת', location: 'עמק זבולון', street1: 'עמק זבולון', street2: '', x: 200200, y: 645200, users: { bus: 1, car: 1 } },
        ];

        const COLORS = {
            'קטלנית': '#EF4444', 
            'קשה': '#F97316',   
            'קלה': '#EAB308',   
        };

        // --- Leaflet Map Component ---
        const LeafletMap = ({ data }) => {
            const mapRef = useRef(null);

            useEffect(() => {
                if (!window.L || typeof window.L.map !== 'function' || !document.getElementById('map-container')) return;

                if (mapRef.current) {
                    mapRef.current.remove();
                    mapRef.current = null;
                }

                try {
                    const map = window.L.map('map-container').setView([31.895, 35.007], 13);
                    mapRef.current = map;

                    window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap contributors',
                        maxZoom: 19
                    }).addTo(map);

                    data.forEach(item => {
                        if (item.x && item.y) {
                            const [lon, lat] = convertITMtoWGS84(item.x, item.y);
                            
                            if (lat && lon && !isNaN(lat) && !isNaN(lon)) {
                                const color = COLORS[item.severity] || COLORS['קלה'];
                                
                                const marker = window.L.circleMarker([lat, lon], {
                                    radius: 8,
                                    fillColor: color,
                                    color: '#fff',
                                    weight: 2,
                                    opacity: 1,
                                    fillOpacity: 0.8
                                });

                                const safeLocation = typeof item.location === 'string' ? item.location : 'מיקום לא ידוע';
                                const safeSeverity = typeof item.severity === 'string' ? item.severity : 'לא ידוע';
                                const safeYear = typeof item.year === 'string' || typeof item.year === 'number' ? item.year : '';
                                const safeType = typeof item.type === 'string' ? item.type : '';

                                const popupContent = `
                                    <div dir="rtl" style="text-align:right; font-family:sans-serif;">
                                        <strong>${safeLocation}</strong><br/>
                                        <span style="color:${color}; font-weight:bold">${safeSeverity}</span> | ${safeYear}<br/>
                                        <small>${safeType}</small>
                                    </div>
                                `;

                                marker.bindPopup(popupContent).addTo(map);
                            }
                        }
                    });
                } catch (err) {
                    console.error("Map initialization failed:", err);
                }

                return () => {
                    if (mapRef.current) {
                        mapRef.current.remove();
                        mapRef.current = null;
                    }
                };
            }, [data]);

            return <div id="map-container" className="w-full h-full z-10" />;
        };

        // --- Main App Component ---
        const App = () => {
            // State for loading libraries
            const [libsLoaded, setLibsLoaded] = useState(false);
            const [loadError, setLoadError] = useState(false);
            
            // Check libraries availability
            useEffect(() => {
                const checkLibs = () => {
                    const isLeafletReady = window.L && typeof window.L.map === 'function';
                    // Recharts needs global Recharts object AND BarChart component
                    const isRechartsReady = window.Recharts && window.Recharts.BarChart;
                    
                    if (isLeafletReady && isRechartsReady) {
                        return true;
                    }
                    return false;
                };

                // Immediate check
                if (checkLibs()) {
                    setLibsLoaded(true);
                    return;
                }

                // Polling check
                const interval = setInterval(() => {
                    if (checkLibs()) {
                        setLibsLoaded(true);
                        clearInterval(interval);
                    }
                }, 200);

                // Timeout after 10 seconds
                const timeout = setTimeout(() => {
                    clearInterval(interval);
                    if (!checkLibs()) {
                        setLoadError(true);
                    }
                }, 10000);

                return () => {
                    clearInterval(interval);
                    clearTimeout(timeout);
                };
            }, []);

            if (loadError) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-red-50 text-red-600 p-4 text-center">
                        <Icons.AlertTriangle className="h-12 w-12 mb-4" />
                        <h2 className="text-xl font-bold mb-2">שגיאה בטעינת משאבים</h2>
                        <p>לא ניתן היה לטעון את ספריות המיפוי והגרפים.</p>
                        <p className="text-sm mt-2">אנא בדוק את חיבור האינטרנט שלך ורענן את הדף.</p>
                        <button 
                            onClick={() => window.location.reload()}
                            className="mt-6 px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition"
                        >
                            נסה שוב
                        </button>
                    </div>
                );
            }

            if (!libsLoaded) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center bg-slate-50 text-slate-500">
                        <div className="loader mb-4"></div>
                        <p className="text-lg font-medium">טוען נתונים וספריות...</p>
                    </div>
                );
            }

            return <DashboardContent />;
        };

        const DashboardContent = () => {
            // Safe destructuring with fallback
            const Recharts = window.Recharts || {};
            const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;
            
            // Double check critical components
            if (!BarChart || !ResponsiveContainer) {
                 return <div className="p-8 text-center text-red-500">שגיאה: רכיבי הגרפים לא נטענו כראוי.</div>;
            }

            const [activeTab, setActiveTab] = useState('map');
            const [data, setData] = useState(INITIAL_DATA);
            const [isEditMode, setIsEditMode] = useState(false);
            const [isReportOpen, setIsReportOpen] = useState(false); // State for the report modal
            const fileInputRef = useRef(null);
            
            const [selectedYear, setSelectedYear] = useState('all');
            const [selectedSeverity, setSelectedSeverity] = useState('all');
            const [selectedRoadType, setSelectedRoadType] = useState('all');

            const [newEntry, setNewEntry] = useState({
                year: 2025, month: 'ינואר', severity: 'קלה', type: 'אחר', 
                roadType: 'עירונית לא בצומת', location: '', x: 0, y: 0, users: {}
            });

            const filteredData = useMemo(() => {
                return data.filter(item => {
                    if (selectedYear !== 'all' && item.year.toString() !== selectedYear) return false;
                    if (selectedSeverity !== 'all' && item.severity !== selectedSeverity) return false;
                    if (selectedRoadType !== 'all' && item.roadType !== selectedRoadType) return false;
                    return true;
                });
            }, [data, selectedYear, selectedSeverity, selectedRoadType]);

            const stats = useMemo(() => {
                const streets = {};
                const intersections = {};
                
                filteredData.forEach(item => {
                    const streetName = typeof item.street1 === 'string' ? item.street1 : 'לא ידוע';
                    if (!streets[streetName]) {
                        streets[streetName] = { name: streetName, count: 0, fatal: 0, severe: 0, light: 0 };
                    }
                    streets[streetName].count++;
                    if (item.severity === 'קטלנית') streets[streetName].fatal++;
                    else if (item.severity === 'קשה') streets[streetName].severe++;
                    else streets[streetName].light++;

                    if ((item.roadType === 'עירונית בצומת' || (item.location && typeof item.location === 'string' && item.location.includes('צומת')))) {
                        const intName = item.location || 'צומת לא ידוע';
                        if (!intersections[intName]) {
                            intersections[intName] = { name: intName, count: 0, fatal: 0, severe: 0, light: 0 };
                        }
                        intersections[intName].count++;
                        if (item.severity === 'קטלנית') intersections[intName].fatal++;
                        else if (item.severity === 'קשה') intersections[intName].severe++;
                        else intersections[intName].light++;
                    }
                });

                return {
                    streets: Object.values(streets).sort((a, b) => b.count - a.count),
                    intersections: Object.values(intersections).sort((a, b) => b.count - a.count)
                };
            }, [filteredData]);

            const handleAddEntry = () => {
                const entryToAdd = {
                    ...newEntry,
                    id: Date.now(),
                    users: { car: 1 } 
                };
                setData([...data, entryToAdd]);
                setIsEditMode(false);
            };

            const parseCSV = (text) => {
                try {
                    const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                    if (lines.length === 0) return;

                    let headerIndex = -1;
                    let headers = [];
                    
                    for (let i = 0; i < Math.min(lines.length, 20); i++) {
                        if (lines[i].includes('שנה') || lines[i].includes('חומרת תאונה')) {
                            headerIndex = i;
                            headers = lines[i].split(',');
                            break;
                        }
                    }

                    if (headerIndex === -1) {
                        alert("לא נמצאה שורת כותרת תקינה בקובץ (מחפש עמודות 'שנה' ו-'חומרת תאונה').");
                        return;
                    }

                    const colMap = {};
                    headers.forEach((h, idx) => {
                        const cleanHeader = h.trim().replace(/"/g, '');
                        colMap[cleanHeader] = idx;
                    });

                    const getValue = (rowParts, colName) => {
                        if (colMap[colName] !== undefined) return rowParts[colMap[colName]]?.trim()?.replace(/"/g, '');
                        const key = Object.keys(colMap).find(k => k.includes(colName));
                        if (key) return rowParts[colMap[key]]?.trim()?.replace(/"/g, '');
                        return '';
                    };

                    const newParsedData = [];
                    
                    for (let i = headerIndex + 1; i < lines.length; i++) {
                        const row = lines[i];
                        const parts = row.includes('"') ? (row.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || row.split(',')) : row.split(',');
                        const cleanParts = parts ? parts.map(p => p.replace(/^,|,$/g, '').replace(/^"|"$/g, '')) : [];

                        if (cleanParts.length < 3) continue; 

                        const year = getValue(cleanParts, 'שנה');
                        const severity = getValue(cleanParts, 'חומרת תאונה');
                        
                        if (year && severity) {
                            const street1 = getValue(cleanParts, 'רחוב ראשון') || getValue(cleanParts, 'רחוב 1') || '';
                            const street2 = getValue(cleanParts, 'רחוב שני') || getValue(cleanParts, 'רחוב 2') || '';
                            const location = getValue(cleanParts, 'שם צומת') || getValue(cleanParts, 'מקום') || `${street1} ${street2}`;
                            const xStr = getValue(cleanParts, '(X)') || getValue(cleanParts, 'X');
                            const yStr = getValue(cleanParts, '(Y)') || getValue(cleanParts, 'Y');

                            newParsedData.push({
                                id: Date.now() + i,
                                year: year,
                                month: getValue(cleanParts, 'חודש') || '',
                                severity: severity,
                                type: getValue(cleanParts, 'סוג תאונה') || '',
                                roadType: getValue(cleanParts, 'סוג דרך') || '',
                                location: location.replace(/"/g, ''),
                                street1: street1.replace(/"/g, ''),
                                street2: street2.replace(/"/g, ''),
                                x: parseFloat(xStr) || 0,
                                y: parseFloat(yStr) || 0,
                                users: { car: 1 }
                            });
                        }
                    }

                    if (newParsedData.length > 0) {
                        setData(newParsedData);
                        alert(`הנתונים נטענו בהצלחה! ${newParsedData.length} רשומות עודכנו.`);
                        setIsEditMode(false);
                    } else {
                        alert("לא נמצאו רשומות תקינות בקובץ.");
                    }

                } catch (e) {
                    console.error(e);
                    alert("שגיאה בעיבוד הנתונים: " + e.message);
                }
            };

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();

                if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                    reader.onload = (e) => {
                        try {
                            if (!window.XLSX) {
                                alert('רכיב קריאת Excel טרם נטען, אנא נסה שוב בעוד מספר שניות.');
                                return;
                            }
                            const data = e.target.result;
                            const workbook = window.XLSX.read(data, { type: 'binary' });
                            let sheetName = workbook.SheetNames[0];
                            const preferredSheet = workbook.SheetNames.find(name => name.includes('משתמשי דרך') || name.includes('XY'));
                            if (preferredSheet) sheetName = preferredSheet;
                            const worksheet = workbook.Sheets[sheetName];
                            const csvOutput = window.XLSX.utils.sheet_to_csv(worksheet);
                            parseCSV(csvOutput);
                        } catch (err) {
                            console.error(err);
                            alert("שגיאה בקריאת קובץ האקסל.");
                        }
                    };
                    reader.readAsBinaryString(file);
                } else {
                    reader.onload = (e) => {
                        const content = e.target.result;
                        parseCSV(content);
                    };
                    reader.readAsText(file);
                }
                event.target.value = '';
            };

            return (
                <div dir="rtl" className="min-h-screen bg-slate-50 text-slate-800 font-sans">
                    <header className="bg-blue-900 text-white p-4 shadow-lg">
                        <div className="container mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <Icons.AlertTriangle className="h-8 w-8 text-yellow-400" />
                                <div>
                                    <h1 className="text-2xl font-bold">מערכת ניטור תאונות דרכים - מודיעין מכבים רעות</h1>
                                    <p className="text-sm opacity-80 text-blue-200">נתונים לשנים 2021-2025</p>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button 
                                    onClick={() => setIsReportOpen(true)}
                                    className="flex items-center gap-2 bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg transition"
                                >
                                    <Icons.FileText size={18} />
                                    דוח כללי
                                </button>
                                <button 
                                    onClick={() => setIsEditMode(!isEditMode)}
                                    className="flex items-center gap-2 bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded-lg transition"
                                >
                                    {isEditMode ? <Icons.X size={18} /> : <Icons.Plus size={18} />}
                                    {isEditMode ? 'סגור עריכה' : 'עדכון נתונים'}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Full Screen Report Modal */}
                    {isReportOpen && (
                        <div className="fixed inset-0 bg-black/60 z-[1000] flex items-center justify-center p-4 backdrop-blur-sm animate-fadeIn">
                            <div className="bg-white w-full h-full max-w-[95vw] max-h-[90vh] rounded-xl shadow-2xl flex flex-col overflow-hidden relative animate-scaleIn">
                                <div className="bg-blue-900 text-white p-4 flex justify-between items-center shrink-0 shadow-md">
                                    <h2 className="text-xl font-bold flex items-center gap-2">
                                        <Icons.FileText /> דוח תאונות דרכים - Power BI
                                    </h2>
                                    <button onClick={() => setIsReportOpen(false)} className="hover:bg-blue-800 p-2 rounded-full transition bg-blue-800/50">
                                        <Icons.X size={24} />
                                    </button>
                                </div>
                                <div className="flex-1 bg-gray-100 relative">
                                     <iframe 
                                        title="Power BI Report" 
                                        width="100%" 
                                        height="100%" 
                                        src="https://app.powerbi.com/view?r=eyJrIjoiNGZmNWRlODktOWVhZS00Y2I3LWE0ZTYtZTRhMjJhNTBmMzI2IiwidCI6Ijg0OTNkZTg2LTdiODctNDBjNS1hYmE5LTI1YWUzNDQ2ZTRmMiIsImMiOjl9" 
                                        frameBorder="0" 
                                        allowFullScreen="true">
                                    </iframe>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="container mx-auto p-4 flex flex-col gap-6">
                        
                        {isEditMode && (
                            <div className="bg-white p-6 rounded-xl shadow-md border border-blue-100 animate-in fade-in slide-in-from-top-4">
                                <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                                    <Icons.Upload size={20} />
                                    הוספת/עדכון נתונים
                                </h3>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                    <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                        <h4 className="font-semibold mb-3 text-sm text-blue-800 flex items-center gap-2">
                                            <Icons.Plus size={16} /> הוספה ידנית בודדת
                                        </h4>
                                        <div className="space-y-3">
                                            <div className="grid grid-cols-2 gap-3">
                                                <input type="number" placeholder="שנה" className="border p-2 rounded bg-white text-sm" value={newEntry.year} onChange={e => setNewEntry({...newEntry, year: e.target.value})} />
                                                <select className="border p-2 rounded bg-white text-sm" value={newEntry.severity} onChange={e => setNewEntry({...newEntry, severity: e.target.value})}>
                                                    <option value="קלה">קלה</option>
                                                    <option value="קשה">קשה</option>
                                                    <option value="קטלנית">קטלנית</option>
                                                </select>
                                            </div>
                                            <input type="text" placeholder="מיקום / רחוב" className="border p-2 rounded w-full bg-white text-sm" value={newEntry.location} onChange={e => setNewEntry({...newEntry, location: e.target.value})} />
                                            <div className="grid grid-cols-2 gap-3">
                                                <input type="number" placeholder="X (רשת ישראל)" className="border p-2 rounded bg-white text-sm" value={newEntry.x} onChange={e => setNewEntry({...newEntry, x: Number(e.target.value)})} />
                                                <input type="number" placeholder="Y (רשת ישראל)" className="border p-2 rounded bg-white text-sm" value={newEntry.y} onChange={e => setNewEntry({...newEntry, y: Number(e.target.value)})} />
                                            </div>
                                            <button onClick={handleAddEntry} className="bg-green-600 text-white w-full py-2 rounded hover:bg-green-500 text-sm font-medium transition">שמור רשומה ידנית</button>
                                        </div>
                                    </div>

                                    <div className="bg-blue-50 p-4 rounded-lg border border-blue-200 flex flex-col">
                                        <h4 className="font-semibold mb-3 text-sm text-blue-800 flex items-center gap-2">
                                            <Icons.FileUp size={16} /> טעינת קובץ נתונים (Excel/CSV)
                                        </h4>
                                        
                                        <div 
                                            className="flex-1 border-2 border-dashed border-blue-300 rounded-lg bg-white flex flex-col items-center justify-center p-6 cursor-pointer hover:bg-blue-50 transition gap-3"
                                            onClick={() => fileInputRef.current?.click()}
                                        >
                                            <Icons.Upload size={32} className="text-blue-400" />
                                            <div className="text-center">
                                                <p className="font-medium text-blue-900">לחץ להעלאת קובץ</p>
                                                <p className="text-xs text-blue-500 mt-1">תומך ב-Excel (.xlsx, .xls) וב-CSV</p>
                                            </div>
                                            <input 
                                                type="file" 
                                                ref={fileInputRef}
                                                className="hidden" 
                                                accept=".csv,.txt,.xlsx,.xls"
                                                onChange={handleFileUpload}
                                            />
                                        </div>
                                        
                                        <div className="mt-3 text-xs text-gray-500">
                                            * המערכת תזהה אוטומטית עמודות: שנה, חומרה, סוג דרך, רחובות וקואורדינטות.
                                            <br/>* המערכת תומכת גם בפורמט אקסל (מחפשת גיליון 'משתמשי דרך').
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="bg-white p-4 rounded-xl shadow-sm flex flex-wrap gap-4 items-center">
                            <div className="flex items-center gap-2 text-slate-500">
                                <Icons.Filter size={18} />
                                <span className="font-semibold">סינון:</span>
                            </div>
                            
                            <select className="border-gray-300 border rounded-md px-3 py-1 bg-slate-50" value={selectedYear} onChange={e => setSelectedYear(e.target.value)}>
                                <option value="all">כל השנים</option>
                                <option value="2021">2021</option>
                                <option value="2022">2022</option>
                                <option value="2023">2023</option>
                                <option value="2024">2024</option>
                                <option value="2025">2025</option>
                            </select>

                            <select className="border-gray-300 border rounded-md px-3 py-1 bg-slate-50" value={selectedSeverity} onChange={e => setSelectedSeverity(e.target.value)}>
                                <option value="all">כל חומרות הפגיעה</option>
                                <option value="קטלנית">קטלנית</option>
                                <option value="קשה">קשה</option>
                                <option value="קלה">קלה</option>
                            </select>

                            <select className="border-gray-300 border rounded-md px-3 py-1 bg-slate-50" value={selectedRoadType} onChange={e => setSelectedRoadType(e.target.value)}>
                                <option value="all">כל סוגי הדרך</option>
                                <option value="עירונית בצומת">בצומת</option>
                                <option value="עירונית לא בצומת">לא בצומת</option>
                            </select>

                            <div className="mr-auto text-sm text-slate-500">
                                סה"כ רשומות מוצגות: <strong>{filteredData.length}</strong>
                            </div>
                        </div>

                        <div className="flex gap-2 border-b border-gray-200">
                            <button 
                                onClick={() => setActiveTab('map')} 
                                className={`px-6 py-3 font-medium flex items-center gap-2 transition-colors ${activeTab === 'map' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <Icons.Map size={18} />
                                מפת תאונות
                            </button>
                            <button 
                                onClick={() => setActiveTab('streets')} 
                                className={`px-6 py-3 font-medium flex items-center gap-2 transition-colors ${activeTab === 'streets' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <Icons.Car size={18} />
                                ניתוח רחובות
                            </button>
                            <button 
                                onClick={() => setActiveTab('intersections')} 
                                className={`px-6 py-3 font-medium flex items-center gap-2 transition-colors ${activeTab === 'intersections' ? 'text-blue-600 border-b-2 border-blue-600 bg-blue-50' : 'text-gray-500 hover:text-gray-700'}`}
                            >
                                <Icons.MapPin size={18} />
                                ניתוח צמתים
                            </button>
                        </div>

                        <div className="bg-white rounded-xl shadow-sm min-h-[500px] border border-gray-100 p-1">
                            
                            {activeTab === 'map' && (
                                <div className="relative w-full h-[600px] rounded-lg overflow-hidden bg-slate-100">
                                    <LeafletMap data={filteredData} />
                                    
                                    <div className="absolute bottom-4 right-4 bg-white/90 p-3 rounded-lg shadow-md backdrop-blur-sm z-[400] text-sm">
                                        <h4 className="font-bold mb-2">מקרא מפה</h4>
                                        <div className="flex flex-col gap-2">
                                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-red-500"></div> קטלנית</div>
                                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-orange-500"></div> קשה</div>
                                            <div className="flex items-center gap-2"><div className="w-3 h-3 rounded-full bg-yellow-400"></div> קלה</div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'streets' && (
                                <div className="p-6 animate-fadeIn">
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                        <div className="lg:col-span-2">
                                            <h3 className="text-xl font-bold mb-4 text-gray-800">הרחובות המסוכנים ביותר</h3>
                                            <div className="h-[400px] w-full">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <BarChart data={stats.streets.slice(0, 10)} layout="vertical" margin={{ top: 5, right: 30, left: 40, bottom: 5 }}>
                                                        <CartesianGrid strokeDasharray="3 3" horizontal={false} />
                                                        <XAxis type="number" />
                                                        <YAxis dataKey="name" type="category" width={120} tick={{fontSize: 12}} />
                                                        <Tooltip contentStyle={{direction: 'rtl', borderRadius: '8px'}} />
                                                        <Legend />
                                                        <Bar dataKey="light" name="קלה" stackId="a" fill={COLORS['קלה']} radius={[0, 4, 4, 0]} />
                                                        <Bar dataKey="severe" name="קשה" stackId="a" fill={COLORS['קשה']} />
                                                        <Bar dataKey="fatal" name="קטלנית" stackId="a" fill={COLORS['קטלנית']} radius={[4, 0, 0, 4]} />
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        </div>
                                        
                                        <div className="bg-blue-50 rounded-xl p-4 h-fit">
                                            <h4 className="font-bold text-blue-900 mb-3">רשימת רחובות מלאה</h4>
                                            <div className="overflow-y-auto max-h-[400px] pr-2">
                                                {stats.streets.map((street, idx) => (
                                                    <div key={idx} className="flex justify-between items-center py-2 border-b border-blue-100 text-sm">
                                                        <span className="font-medium text-gray-700">{street.name}</span>
                                                        <div className="flex items-center gap-2">
                                                           <span className="bg-gray-200 px-2 py-0.5 rounded-full text-xs font-bold">{street.count}</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'intersections' && (
                                <div className="p-6 animate-fadeIn">
                                   <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-2">
                                        <h3 className="text-xl font-bold mb-4 text-gray-800">הצמתים המסוכנים ביותר</h3>
                                        {stats.intersections.length > 0 ? (
                                            <div className="h-[400px] w-full">
                                                <ResponsiveContainer width="100%" height="100%">
                                                    <BarChart data={stats.intersections.slice(0, 10)} layout="vertical" margin={{ top: 5, right: 30, left: 20, bottom: 5 }}>
                                                        <CartesianGrid strokeDasharray="3 3" horizontal={false} />
                                                        <XAxis type="number" />
                                                        <YAxis dataKey="name" type="category" width={150} tick={{fontSize: 10}} interval={0} />
                                                        <Tooltip contentStyle={{direction: 'rtl', borderRadius: '8px'}} />
                                                        <Legend />
                                                        <Bar dataKey="light" name="קלה" stackId="a" fill={COLORS['קלה']} />
                                                        <Bar dataKey="severe" name="קשה" stackId="a" fill={COLORS['קשה']} />
                                                        <Bar dataKey="fatal" name="קטלנית" stackId="a" fill={COLORS['קטלנית']} />
                                                    </BarChart>
                                                </ResponsiveContainer>
                                            </div>
                                        ) : (
                                            <div className="h-full flex items-center justify-center text-gray-400">
                                                אין נתוני צמתים לתצוגה בחתך זה
                                            </div>
                                        )}
                                    </div>

                                    <div className="bg-orange-50 rounded-xl p-4 h-fit">
                                        <h4 className="font-bold text-orange-900 mb-3">פירוט צמתים</h4>
                                        <div className="overflow-y-auto max-h-[400px] pr-2">
                                            {stats.intersections.map((int, idx) => (
                                                <div key={idx} className="mb-3 bg-white p-3 rounded-lg shadow-sm border border-orange-100">
                                                    <div className="font-bold text-gray-800 text-sm mb-1">{int.name}</div>
                                                    <div className="flex gap-2 text-xs">
                                                        {int.fatal > 0 && <span className="bg-red-100 text-red-700 px-2 rounded">קטלניות: {int.fatal}</span>}
                                                        {int.severe > 0 && <span className="bg-orange-100 text-orange-700 px-2 rounded">קשות: {int.severe}</span>}
                                                        <span className="bg-yellow-100 text-yellow-700 px-2 rounded">קלות: {int.light}</span>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                  </div>
                                </div>
                            )}
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
